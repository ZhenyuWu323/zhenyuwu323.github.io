    Experience:
      - company: Georgia Institute of Technology
        position: Research Assistant
        location: Atlanta, GA
        start_date: 2026-07
        end_date: present
        summary: Laboratory for Intelligent Decision and Autonomous Robots (LIDAR), Advised by Prof. Ye Zhao
        projects:
          - name: "TAPNAV: Humanoid Navigation through Tactile Active Perception"
            highlights:
              - "Introduced a **humanoid tactile navigation** framework for vision-denied environments, where the robot localizes by actively probing nearby structures."
              - "Developed a **whole-body control policy** tracking end-effector poses, contact forces, and footsteps, trained with offline IK data, a virtual spring-damper field, and 3D-LIPM references."
              - "Built a **ROS 2 full-stack pipeline** integrating tactile sensing, proprioception, control, and global/local planning."

      - company: University of California San Diego
        position: Graduate Research Assistant
        location: San Diego, CA
        start_date: 2024-09
        end_date: 2026-07
        summary: Advanced Robotics and Controls Laboratory (ARClab), Advised by Prof. Michael Yip
        projects:
          - name: "SteadyTray: Learning Object Balancing Tasks in Humanoid Tray Transport via Residual Reinforcement Learning"
            highlights:
              - "Introduced **ReST-RL**, a student-teacher residual RL framework that keeps unsecured objects on a tray stable while the humanoid walks and **actively rebalances them under disturbances**."
              - "Trained a **residual module** on top of a base walking policy in Isaac Lab, **distilling** a teacher with privileged object states into a student that sees only the AprilTag pose."
              - "Achieved **zero-shot sim-to-real** transfer on a Unitree G1, carrying diverse objects such as a water-filled wine glass under external pushes."
          - name: "Dataset-Free Compliant Humanoid Robot Loco-Manipulation with Dynamic Online Posture"
            highlights:
              - "Introduced **OCLO**, a humanoid loco-manipulation system that takes only target hand poses as input and generates its own whole-body posture, trained without human motion data."
              - "Implemented **whole-body compliance**: IK-controlled arms track force-displaced spring-damper references, while the lower body learns to **adapt to external upper-body force and motion**."
              - "Enabled the Unitree G1 to **stay balanced under end-effector pulls and pushes**, where ablations without this force training mostly failed."

      - company: Lehigh University
        position: Undergraduate Research Assistant
        location: Bethlehem, PA
        start_date: 2023-09
        end_date: 2025-02
        summary: Seed Lab, Advised by Prof. Ning Li
        projects:
          - name: "Methods for Setting Device Specifications for Analog In-Memory Computing Inference"
            highlights:
              - "Introduced a systematic approach to **setting device specifications** for analog in-memory computing, identifying device parameters that keep DNN accuracy within 1% of floating point."
              - "Applied **hardware-aware training** with PyTorch and IBM AIHWKit to make LSTM and ResNet-32 models robust to analog noise before mapping them onto simulated devices."
              - "Evaluated how **PCM device non-idealities** (conductance range, drift, programming and read noise) affect accuracy over time, through large-scale simulations on HPC clusters."

      - company: Lehigh University
        position: Undergraduate Research Assistant
        location: Bethlehem, PA
        start_date: 2023-09
        end_date: 2024-05
        summary: SwarmsLab, Advised by Prof. David Saldaña
        highlights:
          - "Built **lighter-than-air blimp robots** for the “Defend the Republic” swarm competition, from 3D-printed frames to onboard IMU, ultrasonic, and camera sensing."
          - "Implemented **PID control** and camera-based blob tracking for the blimps, with ground-station communication for manual and autonomous modes."
          - "Developed **ROS 2 ground robots** with AprilTag visual servoing, Kalman-filter SLAM, and A*/RRT/PRM planning."

      - company: Lehigh University
        position: Undergraduate Research Assistant
        location: Bethlehem, PA
        start_date: 2023-06
        end_date: 2023-09
        summary: DASH Lab, Advised by Prof. Yu Yang
        highlights:
          - "Developed a **Flutter mobile app** that collects air-quality data from portable Bluetooth sensors in areas without monitoring stations, supporting future ML-based prediction."
          - "Added real-time location tracking, live chart and map visualization, and cloud storage on MongoDB Atlas."


